name: Process Tile Batch

# Reusable workflow called by process_batch.yml.
# Generates the tile matrix for one batch and runs all tiles in that batch.

on:
  workflow_call:
    inputs:
      batch_index:
        type: number
        required: true
      config_file:
        type: string
        required: false
        default: 'config/config_v1.txt'
      which_tiles:
        type: string
        required: false
        default: 'unprocessed'
    secrets:
      AZURE_STORAGE_SAS_TOKEN:
        required: true
      EARTHDATA_USERNAME:
        required: true
      EARTHDATA_PASSWORD:
        required: true

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-tiles.outputs.matrix }}
      count: ${{ steps.get-tiles.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.39.0
          environments: ci

      - name: Install package
        run: pixi run -e ci pip install -e .

      - name: Generate tile matrix for batch ${{ inputs.batch_index }}
        id: get-tiles
        env:
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        run: |
          OUTPUT=$(pixi run -e ci python processing/scripts/get_tiles_for_batch.py \
            --config-file ${{ inputs.config_file }} \
            --which-tiles ${{ inputs.which_tiles }} \
            --batch-index ${{ inputs.batch_index }})
          COUNT=$(echo "$OUTPUT" | python -c "import sys,json; print(len(json.load(sys.stdin)['tile']))")
          echo "matrix=$OUTPUT" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT

  process-tiles:
    needs: generate-matrix
    if: fromJson(needs.generate-matrix.outputs.count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    # Explicit job name enables log identification by tile
    name: process-tile-h${{ matrix.tile.h }}-v${{ matrix.tile.v }}

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.39.0
          environments: ci

      - name: Install package
        run: pixi run -e ci pip install -e .

      - name: Process tile
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          pixi run -e ci python processing/scripts/process_single_tile.py \
            --h ${{ matrix.tile.h }} \
            --v ${{ matrix.tile.v }} \
            --config-file ${{ inputs.config_file }}
