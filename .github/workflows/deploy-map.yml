name: Deploy map to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'map/**'
      - 'modis_snow_phenology/**'
      - 'processing/tile_list.geojson'
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Config file to use'
        required: false
        default: 'config/config_v1.txt'
        type: choice
        options:
          - config/config_v1.txt

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out this repo into a subdirectory so that ../../zarr-layer resolves correctly
      - uses: actions/checkout@v4
        with:
          path: MODIS_snow_phenology

      # zarr-layer is a local file: dep at ../../zarr-layer relative to map/
      # Using egagli/zarr-layer fork which has the worldFraction fix for MODIS
      # sinusoidal CRS (needed for correct multiscale pyramid level selection).
      - uses: actions/checkout@v4
        with:
          repository: egagli/zarr-layer
          path: zarr-layer

      # --- Python: generate tiles-status.geojson from Icechunk history -------
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.39.0
          environments: ci
          manifest-path: MODIS_snow_phenology/pixi.toml

      - name: Generate tiles status GeoJSON
        working-directory: MODIS_snow_phenology
        env:
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        run: |
          pixi run -e ci python map/generate_tiles_status_geojson.py \
            --config "${{ inputs.config_file || 'config/config_v1.txt' }}"

      # Extract MULTISCALE_PREFIX from the config and set NEXT_PUBLIC_ZARR_URL
      # so the Next.js build bakes the correct zarr URL into the static bundle.
      - name: Set NEXT_PUBLIC_ZARR_URL from config
        working-directory: MODIS_snow_phenology
        run: |
          CONFIG="${{ inputs.config_file || 'config/config_v1.txt' }}"
          ACCOUNT=$(grep '^AZURE_STORAGE_ACCOUNT' "$CONFIG" | cut -d'=' -f2 | tr -d ' ')
          CONTAINER=$(grep '^AZURE_CONTAINER'       "$CONFIG" | cut -d'=' -f2 | tr -d ' ')
          PREFIX=$(grep  '^MULTISCALE_PREFIX'        "$CONFIG" | cut -d'=' -f2 | tr -d ' ')
          echo "NEXT_PUBLIC_ZARR_URL=https://${ACCOUNT}.blob.core.windows.net/${CONTAINER}/${PREFIX}" >> $GITHUB_ENV

      # --- Node: build Next.js static export ----------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MODIS_snow_phenology/map/package-lock.json

      - name: Build zarr-layer
        working-directory: zarr-layer
        run: npm install --ignore-scripts && npm run build

      - name: Install map dependencies
        working-directory: MODIS_snow_phenology/map
        run: HUSKY=0 npm ci

      - name: Build map
        working-directory: MODIS_snow_phenology/map
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: MODIS_snow_phenology/map/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
